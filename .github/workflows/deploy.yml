name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-home/package-lock.json

      - name: Install homepage dependencies
        working-directory: web-home
        run: npm ci

      - name: Build React homepage
        working-directory: web-home
        run: npm run build

      # The 12 games are plain, dependency-free HTML/CSS/JS by design and
      # deploy completely untouched — only the homepage goes through a build.
      - name: Assemble static site
        run: |
          mkdir -p dist
          cp *.html dist/ 2>/dev/null || true
          cp -r css dist/css
          cp -r js dist/js
          cp -r web-home/dist/. dist/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
